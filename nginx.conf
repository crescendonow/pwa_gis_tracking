	location /dmama_api/ {
                proxy_pass http://localhost:5013/; 
                
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
				proxy_set_header X-API-Key $http_x_api_key;
            }
			location /bldg_insert_api/template/ {
                # Public static documentation for bldg_insert_api.
                # Keep this before /bldg_insert_api/ so docs are served by nginx
                # instead of being proxied to the authenticated Go API.
                alias "E:/Projects/bldg_insert_api/template/";
                index api_doc.html;
                try_files $uri =404;

                add_header Cache-Control "no-store";
            }
	location /bldg_insert_api/ {
                # Building Insert API (Go) — real server on port 5014
                proxy_pass http://localhost:5014/;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
				
				# forward the API key header to the Go service (auth: X-API-Key)
                proxy_set_header X-API-Key $http_x_api_key;

                # building upload payloads (GeoJSON FeatureCollection) can be large
                client_max_body_size 50m;
            }
	location = /software_test {
                return 301 /software_test/;
           }
	location /software_test/ {
                # Keep this port in sync with APP_ADDR in .env.
                proxy_pass  http://localhost:5020/;
                proxy_set_header       Host $host;
                proxy_set_header       X-Real-IP $remote_addr;
                proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header       X-Forwarded-Proto $scheme;
                proxy_set_header       X-Forwarded-Prefix /software_test;
                proxy_buffering        on;
                proxy_cache            STATIC;
                proxy_cache_valid      200 302 0m;
                proxy_cache_valid      404 0m;
           }
		
        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
	location ^~ /gis_servicearea_external/backend/ {
    #  source Go/SQL + credential DB
    deny all;
    return 404;
	}
	location /gis_servicearea_external/ {
		alias "E:/Projects/gis_servicearea_external/";
		index app.html;
		try_files $uri $uri/ /gis_servicearea_external/app.html;

	}
	# (option) redirect
	location = /gis_servicearea_external { return 301 /gis_servicearea_external/; }

	# ---------- 2) /api/ -> Go unified backend (localhost:5015) ----------
	location /api/ {
		proxy_pass http://localhost:5015;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}

	# ---------- 3) /tiles/ -> Martin (vector tile potential) ----------
	location /tiles/ {
		proxy_pass http://127.0.0.1:5030/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		# MVT compress from PostGIS/Martin 
		gzip off;
		add_header Cache-Control "public, max-age=60";
	}

