            # Loopback-only Martin diagnostics. Browser map tiles use the
            # authenticated Go endpoint under /pwa_gis_tracking/api/map/tiles/.
            location ^~ /pwa_gis_tracking/_martin/ {
                allow 127.0.0.1;
                allow ::1;
                deny all;
                proxy_pass http://127.0.0.1:5031/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                gzip off;
            }

			location /pwa_gis_tracking/ {
