
#user  nobody;
worker_processes auto;
worker_rlimit_nofile 10000;  # เพิ่มจำนวน file descriptors ที่แต่ละ worker ใช้ได้

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  2048;
    #use iocp;  # For Windows, IO Completion Ports is recommended
}


http {
   server_names_hash_bucket_size  64;
    include       mime.types;
    default_type  application/octet-stream;
   
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    keepalive_timeout 30s;         # ลดเวลาเชื่อมต่อ idle (ปรับให้เหมาะสม)
    sendfile on;                  # เปิดใช้งาน sendfile เพื่อเพิ่มประสิทธิภาพ
    tcp_nopush on;                # เพิ่มประสิทธิภาพในการส่งข้อมูล TCP
    tcp_nodelay on;               # ลดเวลาแฝงสำหรับคำขอขนาดเล็ก
    server_tokens off;            # ปิดการแสดงข้อมูลเวอร์ชัน
    client_max_body_size 16M;     # ปรับขนาดไฟล์ที่อนุญาตให้อัปโหลดได้
    large_client_header_buffers 8 32k; # เพิ่มบัฟเฟอร์สำหรับ header ขนาดใหญ่
     client_body_timeout 15s;
    client_header_timeout 15s;
   # keepalive_timeout 15s;
    send_timeout 10s;
    #gzip  on;

    upstream  MeterstatServer {
		server  110.76.152.114:443;
		
    }
   upstream  vm107{
		server  localhost:88;
		
    }
    upstream  BackendServer {
		#server  110.76.152.107:8080 weight=4 ;
                server  127.0.0.1:8000;
		#server  110.76.152.155:8080;
		#server  110.76.152.156:8080;
    }
      map $http_connection $connection_upgrade {
          "~*Upgrade" $http_connection;
        default keep-alive;
    }
    server {
        listen 80;

        #server_name _;

        return 301 https://$host$request_uri;
    }

